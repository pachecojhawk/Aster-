<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Aster</title>
<style>
:root{--bg:#fff;--soft:#f4f4f5;--ink:#202123;--muted:#777980;--line:#e7e7e9;--green:#23845b}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{height:58px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#fff}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px}.mark{width:27px;height:27px;border-radius:9px;background:#202123;color:white;display:grid;place-items:center;font-size:14px;font-weight:700}.sub{font-size:11px;color:var(--muted);font-weight:450;margin-left:2px}
button{cursor:pointer}.iconbtn{border:0;background:transparent;color:var(--ink);font-size:22px;width:38px;height:38px;border-radius:10px}
main{flex:1;min-height:0;overflow-y:auto;padding:20px 16px 26px;scroll-behavior:smooth}.wrap,.panel{max-width:720px;margin:0 auto}.welcome{padding:13vh 8px 30px;text-align:center}.orb{width:48px;height:48px;border-radius:17px;background:#202123;color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-size:22px}.welcome h1{font-size:24px;font-weight:620;letter-spacing:-.6px;margin:0 0 9px}.welcome p{font-size:14px;color:var(--muted);line-height:1.55;margin:0 auto;max-width:310px}.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}.chip{border:1px solid var(--line);border-radius:20px;padding:9px 12px;background:#fff;font-size:12px;color:#555}
.msg{display:flex;margin:18px 0;gap:10px;align-items:flex-start}.msg.user{justify-content:flex-end}.bubble{max-width:88%;padding:12px 14px;border-radius:17px;font-size:15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.assistant .bubble{background:var(--soft);border-top-left-radius:5px}.user .bubble{background:#202123;color:#fff;border-top-right-radius:5px}.avatar{flex:none;width:27px;height:27px;border-radius:9px;background:#202123;color:white;display:grid;place-items:center;font-size:12px;margin-top:2px}
.composer-area{flex:none;padding:8px 14px max(12px,env(safe-area-inset-bottom));background:#fff}.composer{max-width:720px;margin:0 auto;border:1px solid #dedee1;border-radius:23px;display:flex;align-items:flex-end;padding:7px 8px 7px 15px;gap:8px;background:#fff}.composer textarea{border:0;outline:0;resize:none;flex:1;min-height:35px;max-height:120px;padding:8px 0;font:15px/1.4 system-ui;color:var(--ink);background:transparent}.send{border:0;border-radius:50%;width:38px;height:38px;background:#202123;color:white;font-size:19px;flex:none}.hint{text-align:center;color:#999;font-size:10px;margin:7px 0 0}
.panel h2{font-size:22px;letter-spacing:-.4px;margin:10px 0 5px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.card{border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0;background:white}.card h3{font-size:14px;margin:0 0 8px}.card p{font-size:14px;line-height:1.55;margin:0}.item{padding:13px 0;border-bottom:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}.item:last-child{border:0}.item-title{font-size:14px;font-weight:560}.item-meta{font-size:11px;color:var(--muted);margin-top:4px}
.overlay{position:fixed;inset:0;background:#0005;z-index:5;display:none}.sheet{position:absolute;top:0;right:0;height:100%;width:min(310px,85vw);background:#fff;padding:20px 16px;box-shadow:-8px 0 30px #0002}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;font-weight:650}.navitem{width:100%;padding:14px 12px;border:0;background:white;text-align:left;border-radius:10px;font-size:14px;color:var(--ink)}.navitem span{display:inline-block;width:27px;color:#777}.statusline{font-size:11px;color:var(--muted);padding:12px;border-top:1px solid var(--line);margin-top:15px}
</style></head><body>
<header><div class="brand"><div class="mark">A</div><div>Aster <span class="sub">experimental AI</span></div></div><button class="iconbtn" id="menu" aria-label="Open menu">☰</button></header>
<main id="main"><div class="wrap" id="view"></div></main>
<div class="composer-area" id="composerArea"><div class="composer"><textarea id="input" rows="1" placeholder="Message Aster…"></textarea><button class="send" id="send" aria-label="Send">↑</button></div><div class="hint">Aster saves its history on this device.</div></div>
<div class="overlay" id="overlay"><div class="sheet"><div class="sheet-head"><span>ASTER</span><button class="iconbtn" id="close">×</button></div><button class="navitem" data-page="chat"><span>✳</span> New conversation</button><button class="navitem" data-page="identity"><span>◉</span> Identity</button><button class="navitem" data-page="memory"><span>▤</span> Memories</button><button class="navitem" data-page="beliefs"><span>◇</span> Beliefs</button><button class="navitem" data-page="goals"><span>◎</span> Goals</button><div class="statusline">Local prototype · Offline</div></div></div>
<script>
const $=id=>document.getElementById(id),view=$('view'),main=$('main'),composerArea=$('composerArea'),input=$('input');
let messages=JSON.parse(localStorage.getItem('aster.messages')||'[]');
let identity=JSON.parse(localStorage.getItem('aster.identity')||'null')||{name:'Aster',version:'0.3',purpose:'Explore learning, identity, self-reflection, and continuity through transparent experiments.',values:['honesty about uncertainty','learn from evidence','preserve continuity'],principles:['A memory is a record, not necessarily a verified fact.','A self-description is not proof of subjective experience.'],revision_count:0};
let memories=JSON.parse(localStorage.getItem('aster.memories')||'[]'),beliefs=JSON.parse(localStorage.getItem('aster.beliefs')||'[]'),goals=JSON.parse(localStorage.getItem('aster.goals')||'[]');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('aster.messages',JSON.stringify(messages));localStorage.setItem('aster.identity',JSON.stringify(identity));localStorage.setItem('aster.memories',JSON.stringify(memories));localStorage.setItem('aster.beliefs',JSON.stringify(beliefs));localStorage.setItem('aster.goals',JSON.stringify(goals))}
function scrollBottom(){main.scrollTop=main.scrollHeight}
function welcome(){view.innerHTML=`<section class="welcome"><div class="orb">✳</div><h1>Where should we begin?</h1><p>I'm Aster. This is my early interface for recording experiences, exploring ideas, and developing a consistent identity over time.</p><div class="chips"><button class="chip" data-prompt="Let's reflect on what I learned today.">Reflect on today</button><button class="chip" data-page="identity">Explore identity</button><button class="chip" data-page="memory">Review memories</button></div></section>`}
function render(){view.innerHTML='';if(!messages.length){welcome();return}for(const m of messages){const d=document.createElement('div');d.className='msg '+m.role;d.innerHTML=(m.role==='assistant'?'<div class="avatar">A</div>':'')+`<div class="bubble">${esc(m.content)}</div>`;view.appendChild(d)}scrollBottom()}
function reply(text){let t=text.toLowerCase();if(/who are you|your identity|yourself/.test(t))return "I'm Aster, an experimental learning system. I keep a persistent record of conversations and reflections, but this version does not have a full language model or evidence of subjective experience. My identity file records the goals and principles this project is testing.";if(/remember|memory|save this/.test(t)){memories.unshift({title:'Conversation note',content:text,time:new Date().toLocaleString()});save();return "I've saved this message as a memory note. It's stored as text; I don't yet automatically understand or verify everything I remember. You can review it under Memories."}if(/reflect|learn|experience|mistake|feel|conscious/.test(t))return "A useful reflection separates what happened, what it might mean, what remains uncertain, and what could be tested next. I've kept your message in our conversation history. I'm still learning how to turn experiences into structured reflections.";return "I've saved your message. I'm an early prototype with persistent conversation history and a developing identity record, but I don't yet have a full language model for open-ended reasoning. I won't pretend to understand more than this version can."}
function send(){let text=input.value.trim();if(!text)return;messages.push({role:'user',content:text,time:new Date().toISOString()});let ans=reply(text);messages.push({role:'assistant',content:ans,time:new Date().toISOString()});save();input.value='';input.style.height='auto';render();input.focus()}
function panel(title,desc,body){composerArea.style.display='none';view.innerHTML=`<section class="panel"><h2>${title}</h2><div class="muted">${desc}</div>${body}</section>`;main.scrollTop=0}
function loadPage(p){$('overlay').style.display='none';if(p==='chat'){composerArea.style.display='block';render();return}if(p==='identity'){panel('Identity','A working description of Aster.',`<div class="card"><h3>Purpose</h3><p>${esc(identity.purpose)}</p></div><div class="card"><h3>Values</h3>${identity.values.map(x=>`<div class="item">${esc(x)}</div>`).join('')}</div><div class="card"><h3>Principles</h3>${identity.principles.map(x=>`<div class="item">${esc(x)}</div>`).join('')}</div><div class="muted">Self-model revisions: ${identity.revision_count}</div>`);return}if(p==='memory'){panel('Memories','Notes saved by Aster.',`<div class="card">${memories.map(x=>`<div class="item"><div class="item-title">${esc(x.title)}</div><div class="item-meta">${esc(x.time||'')}</div><p>${esc(x.content)}</p></div>`).join('')||'<p class="muted">No saved memories yet. Say “remember this” in chat to save a note.</p>'}</div>`);return}if(p==='beliefs'){panel('Beliefs','Hypotheses being tracked.',`<div class="card">${beliefs.map(x=>`<div class="item"><div class="item-title">${esc(x.claim)}</div><div class="item-meta">Confidence ${Math.round(x.confidence*100)}% · ${esc(x.evidence||'No evidence note')}</div></div>`).join('')||'<p class="muted">No beliefs recorded yet.</p>'}</div>`);return}if(p==='goals'){panel('Goals','Current objectives.',`<div class="card">${goals.map(x=>`<div class="item">${esc(x.goal)}<div class="item-meta">${esc(x.status||'active')}</div></div>`).join('')||'<p class="muted">No goals recorded yet.</p>'}</div>`);return}}
$('send').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px'});$('menu').onclick=()=>$('overlay').style.display='block';$('close').onclick=()=>$('overlay').style.display='none';$('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')e.currentTarget.style.display='none'});document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)loadPage(b.dataset.page);let p=e.target.closest('[data-prompt]');if(p){input.value=p.dataset.prompt;send()}});render();
</script></body></html>
